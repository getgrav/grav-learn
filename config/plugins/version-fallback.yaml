enabled: true
fallback:
  2: [17]
# Routes under /2 that must NOT fall back to the 1.7 tree. A fallback page is
# fine when it is merely out of date; these are the ones where a 1.7 page gives
# a Grav 2 reader an actively wrong instruction, usually "bin/gpm install admin"
# or a walkthrough of the classic admin's Plugins > Add screen, neither of
# which exists on Grav 2 (getgrav/grav#4273). Remove an entry once a real Grav 2
# page is written for it.
suppress:
  2:
    - /admin-panel
    - /webservers-hosting
