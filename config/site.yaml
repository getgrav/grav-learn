title: Grav Documentation
metadata:
    description: 'Grav documentation'

author:
  name: Andy Miller
  email: 'andy@getgrav.org'

taxonomies: [category,tag]
summary:
  size: 300

redirects:
  # The 2.x docs moved from /20/ to /2/ so the path tracks the major line, not a
  # point release. Keep this first so the version collapses before the rules below.
  '/20/(.*)': '/2/$1[301]'
  '/15/(.*)': '/17/$1'
  '/(\d+)/premium(/.*)?$': '/$1/grav-premium$2'
  '/premium(/.*)?$': '/grav-premium$1'
  '/16/(.*)': '/17/$1'
  # Each rule ends on a path-segment boundary: Grav anchors redirect patterns at the
  # start only and keeps whatever follows the match, so an open-ended rule also
  # caught longer slugs (twig-tags matched twig-tags-filters-functions and kept
  # nesting the leftover on every hop). Targets keep the version, since an
  # unversioned path only resolves for pages that exist in the 2.x docs.
  '/(\d+)/hosting/rochen(?=/|\?|$)': '/$1/webservers-hosting/shared/rochen'
  '/(\d+)/hosting/wirenine(?=/|\?|$)': '/$1/webservers-hosting/shared/wirenine'
  '/(\d+)/hosting/crucial(?=/|\?|$)': '/$1/webservers-hosting/shared/crucial'
  '/(\d+)/hosting/arvixe(?=/|\?|$)': '/$1/webservers-hosting/shared/arvixe'
  '/(\d+)/hosting/siteground(?=/|\?|$)': '/$1/webservers-hosting/shared/siteground'
  '/(\d+)/hosting/dreamhost(?=/|\?|$)': '/$1/webservers-hosting/shared/dreamhost'
  '/(\d+)/advanced/route-aliases(?=/|\?|$)': '/$1/content/routing'
  '/(\d+)/advanced/grav-cli(?=/|\?|$)': '/$1/cli-console/grav-cli'
  '/(\d+)/advanced/grav-cli-plugin(?=/|\?|$)': '/$1/cli-console/grav-cli-plugin'
  '/(\d+)/advanced/grav-gpm(?=/|\?|$)': '/$1/cli-console/grav-cli-gpm'
  '/(\d+)/advanced/command-line(?=/|\?|$)': '/$1/cli-console/command-line-intro'
  '/(\d+)/advanced/blueprints(?=/|\?|$)': '/$1/forms/blueprints'
  '/(\d+)/advanced/forms(?=/|\?|$)': '/$1/forms/forms'
  '/(\d+)/advanced/contact-form(?=/|\?|$)': '/$1/forms/forms/example-form'
  '/(\d+)/advanced/grav-lifecycle(?=/|\?|$)': '/$1/plugins/grav-lifecycle'
  '/(\d+)/hosting/': '/$1/webservers-hosting/'
  '/(\d+)/themes/twig-tags(?=/|\?|$)': '/$1/themes/twig-tags-filters-functions/tags'
  '/advanced/grav-gpm': '/cli-console/grav-cli-gpm'


